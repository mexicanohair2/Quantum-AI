name: Quantum-AI checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/web-search.js
          node --check src/assistant-tools.js
          node --check tests/assistant-tools.mjs
          node --check sw.js
          node --check scripts/validate.mjs
          node --check tests/ui-smoke.mjs
      - name: Run static regression checks
        run: node scripts/validate.mjs
      - name: Install browser test runtime
        run: |
          npm init -y
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/quantum-ai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/assistant-tools.mjs
          node tests/ui-smoke.mjs
