<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0a10">
<meta name="description" content="Quantum-AI — онлайн-чат с искусственным интеллектом.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css?v=20261123-shared-auth-v1">
<title>Quantum-AI</title>
</head>
<body>
<div class="app-shell">
 <div class="mobile-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
 <aside class="sidebar" id="sidebar" aria-label="История чатов">
  <div class="sidebar-brand">
   <img class="brand-icon" src="./icon.svg" alt="">
   <div class="brand-copy"><div class="brand-name">Quantum-AI</div></div>
   <button class="icon-button mobile-close" id="closeSidebarBtn" type="button" aria-label="Закрыть меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
   </button>
  </div>
  <button class="primary-button" id="newChatBtn" type="button" disabled>
   <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
   Новый чат
  </button>
  <div class="sidebar-label">История</div>
  <div class="history-list" id="chatHistory" aria-live="polite"></div>
 </aside>
 <div class="main-shell">
  <header class="topbar">
   <button class="icon-button menu-button" id="menuBtn" type="button" aria-label="Открыть историю чатов">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
   </button>
   <div class="topbar-title"><div class="topbar-heading" id="viewTitle">Quantum-AI</div></div>
   <div class="auth-status" id="authStatus" data-state="loading" role="status">Проверяем аккаунт…</div>
  </header>
  <main class="main-content">
   <section class="view" id="chatView" aria-label="Чат">
    <div class="chat-scroll" id="chatScroll">
     <div class="chat-inner">
      <div class="welcome" id="welcome">
       <div class="welcome-mark"><img src="./icon.svg" alt=""></div>
       <h1>Чем помочь?</h1>
      </div>
      <div class="thread-messages" id="threadMessages"></div>
     </div>
    </div>
    <div class="composer-wrap">
     <div class="chat-error" id="chatError" role="status" aria-live="polite" hidden></div>
     <a class="login-link" id="loginLink" href="https://mexicanohair2.github.io/QQcross/" target="_blank" rel="noopener noreferrer" hidden>Открыть QQCross и войти в аккаунт</a>
     <form class="composer" id="messageForm" aria-label="Новое сообщение">
      <textarea id="prompt" rows="1" maxlength="1800" placeholder="Напиши сообщение…" aria-label="Сообщение" disabled></textarea>
      <button class="send-button" id="sendBtn" type="submit" aria-label="Отправить сообщение" disabled>
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-5 14-2-6-7-1Z"/><path d="m12 13 7-8"/></svg>
      </button>
     </form>
    </div>
   </section>
  </main>
 </div>
</div>
<script>
(function(){
  var urls=[
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js",
    "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
  ];
  function startApp(){
    if(document.querySelector('script[data-quantum-app]'))return;
    var app=document.createElement("script");
    app.type="module";
    app.src="./src/app.js?v=20261123-shared-auth-v1";
    app.dataset.quantumApp="true";
    app.onerror=function(){
      var status=document.getElementById("authStatus");
      var error=document.getElementById("chatError");
      if(status){status.textContent="Ошибка запуска";status.dataset.state="warning"}
      if(error){error.textContent="Не удалось загрузить приложение. Обнови страницу.";error.hidden=false}
    };
    document.body.appendChild(app);
  }
  function load(index){
    if(index>=urls.length){startApp();return}
    var script=document.createElement("script");
    var settled=false;
    var timeout=setTimeout(function(){
      if(settled)return;
      settled=true;script.remove();load(index+1);
    },4500);
    script.src=urls[index];
    script.onload=function(){
      if(settled)return;
      settled=true;clearTimeout(timeout);
      if(window.supabase&&typeof window.supabase.createClient==="function")startApp();
      else load(index+1);
    };
    script.onerror=function(){
      if(settled)return;
      settled=true;clearTimeout(timeout);load(index+1);
    };
    document.head.appendChild(script);
  }
  load(0);
})();
</script>
</body>
</html>
